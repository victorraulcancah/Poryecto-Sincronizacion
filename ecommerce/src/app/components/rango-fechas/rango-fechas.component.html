<div class="rango-fechas">
  <!-- Disparador -->
  <button #disparador type="button" class="rango-fechas__trigger" (click)="alternar()">
    <i class="ph ph-calendar-blank"></i>
    <span>{{ resumen }}</span>
    <i class="ph ph-caret-down rango-fechas__caret"></i>
  </button>

  <!-- Panel. Va con position:fixed (ver `posicion` en el componente) porque la
       tarjeta que lo contiene tiene overflow-hidden y lo recortaría. -->
  <div
    class="rango-fechas__panel"
    *ngIf="abierto"
    [style.top.px]="posicion.top"
    [style.left.px]="posicion.left"
  >
    <!-- Atajos en columna, como el filtro de reportes del ERP. -->
    <div class="rango-fechas__atajos">
      <button
        type="button"
        *ngFor="let atajo of atajos"
        class="rango-fechas__atajo"
        (click)="aplicarAtajo(atajo)"
      >
        {{ atajo.etiqueta }}
      </button>
    </div>

    <div class="rango-fechas__calendario">
      <div class="rango-fechas__meses">
        <!-- Mes izquierdo -->
        <div class="rango-fechas__mes">
          <div class="rango-fechas__cabecera">
            <div class="rango-fechas__navs">
              <button type="button" class="rango-fechas__nav" (click)="anioAnteriorVista()" aria-label="Año anterior">
                <i class="ph ph-caret-double-left"></i>
              </button>
              <button type="button" class="rango-fechas__nav" (click)="mesAnterior()" aria-label="Mes anterior">
                <i class="ph ph-caret-left"></i>
              </button>
            </div>
            <span class="rango-fechas__titulo">
              {{ nombreMes(mesBase) }} <span class="rango-fechas__anio">{{ mesBase.getFullYear() }}</span>
            </span>
            <span class="rango-fechas__navs rango-fechas__navs--oculto"></span>
          </div>

          <div class="rango-fechas__semana">
            <span *ngFor="let d of diasSemana">{{ d }}</span>
          </div>

          <div class="rango-fechas__dias">
            <button
              type="button"
              *ngFor="let dia of diasDe(mesBase); trackBy: trackDia"
              class="rango-fechas__dia"
              [class.fuera]="noSeleccionable(dia)"
              [class.hoy]="esHoy(dia)"
              [class.extremo]="esInicio(dia) || esFin(dia)"
              [class.rango]="enRango(dia)"
              [disabled]="noSeleccionable(dia)"
              (click)="elegir(dia)"
              (mouseenter)="hover = dia.fecha"
            >
              {{ dia.fecha.getDate() }}
            </button>
          </div>
        </div>

        <!-- Mes derecho -->
        <div class="rango-fechas__mes">
          <div class="rango-fechas__cabecera">
            <span class="rango-fechas__navs rango-fechas__navs--oculto"></span>
            <span class="rango-fechas__titulo">
              {{ nombreMes(mesSecundario) }} <span class="rango-fechas__anio">{{ mesSecundario.getFullYear() }}</span>
            </span>
            <div class="rango-fechas__navs">
              <button type="button" class="rango-fechas__nav" (click)="mesSiguiente()" aria-label="Mes siguiente">
                <i class="ph ph-caret-right"></i>
              </button>
              <button type="button" class="rango-fechas__nav" (click)="anioSiguienteVista()" aria-label="Año siguiente">
                <i class="ph ph-caret-double-right"></i>
              </button>
            </div>
          </div>

          <div class="rango-fechas__semana">
            <span *ngFor="let d of diasSemana">{{ d }}</span>
          </div>

          <div class="rango-fechas__dias">
            <button
              type="button"
              *ngFor="let dia of diasDe(mesSecundario); trackBy: trackDia"
              class="rango-fechas__dia"
              [class.fuera]="noSeleccionable(dia)"
              [class.hoy]="esHoy(dia)"
              [class.extremo]="esInicio(dia) || esFin(dia)"
              [class.rango]="enRango(dia)"
              [disabled]="noSeleccionable(dia)"
              (click)="elegir(dia)"
              (mouseenter)="hover = dia.fecha"
            >
              {{ dia.fecha.getDate() }}
            </button>
          </div>
        </div>
      </div>

      <!-- Pie. Dos campos: el clic en uno decide qué extremo cambia el
           siguiente día que se elija, sin borrar el otro. -->
      <div class="rango-fechas__pie">
        <div class="rango-fechas__campos">
          <!-- Se pueden escribir a mano, como el filtro de reportes del ERP. -->
          <label class="rango-fechas__campo" [class.activo]="extremo === 'inicio'">
            <span class="rango-fechas__campo-label">Desde</span>
            <input
              type="text"
              class="rango-fechas__campo-input"
              placeholder="dd/mm/aaaa"
              maxlength="10"
              [value]="entradaInicio"
              (focus)="editarExtremo('inicio')"
              (input)="escribir('inicio', $any($event.target).value)"
              (blur)="cerrarEdicion()"
            />
          </label>

          <i class="ph ph-arrow-right rango-fechas__flecha"></i>

          <label class="rango-fechas__campo" [class.activo]="extremo === 'fin'">
            <span class="rango-fechas__campo-label">Hasta</span>
            <input
              type="text"
              class="rango-fechas__campo-input"
              placeholder="dd/mm/aaaa"
              maxlength="10"
              [value]="entradaFin"
              (focus)="editarExtremo('fin')"
              (input)="escribir('fin', $any($event.target).value)"
              (blur)="cerrarEdicion()"
            />
          </label>
        </div>

        <div class="rango-fechas__acciones">
          <button type="button" class="rango-fechas__borrar" (click)="borrar()">Borrar</button>
          <button type="button" class="rango-fechas__aplicar" [disabled]="!seleccionInicio" (click)="confirmar()">
            Aplicar
          </button>
        </div>
      </div>
    </div>
  </div>
</div>
